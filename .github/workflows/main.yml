name: Build Edition X APK (Auto-Repair Mode)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Auto-Repair Project Structure
        run: |
          # 1. Ek temporary folder mein fresh project banana
          flutter create --platforms android temp_app
          
          # 2. Tumhari original files ko temporary project mein merge karna
          # Agar 'lib' folder hai toh use replace karega
          if [ -d "lib" ]; then
            rm -rf temp_app/lib
            cp -r lib temp_app/
          fi
          
          # 3. pubspec.yaml ko replace karna
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml temp_app/
          fi

      - name: Install Dependencies
        run: |
          cd temp_app
          # Pub get chalana aur agar error aaye toh ignore karke aage badhna
          flutter pub get || true

      - name: Build APK (Bypass Errors)
        run: |
          cd temp_app
          # Release APK banana bina icons ki tension liye
          flutter build apk --release --no-tree-shake-icons --ignore-deprecation

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Edition-X-Release-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
          
          
