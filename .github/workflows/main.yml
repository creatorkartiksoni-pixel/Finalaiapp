name: Build Edition X (Ultimate Auto-Fix)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Pre-Build Health Check
        run: |
          flutter doctor -v || true
          # Agar android folder missing hai, toh flutter khud generate karega
          if [ ! -d "android" ]; then
            flutter create . --platforms android --force
          fi

      - name: Auto-Fix Generate Missing Files
        run: |
          echo "🔧 Auto-fixing missing Android files..."
          mkdir -p android/app/src/main/res/values || true
          
          # Check if AndroidManifest.xml exists, if not create a basic one
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Creating basic AndroidManifest..."
            mkdir -p android/app/src/main/
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.editionx"></manifest>' > android/app/src/main/AndroidManifest.xml
          fi
          
          echo "🧹 Cleaning pubspec.yaml from missing assets..."
          # Sab kuch uda rahe ho, par yaad rakhna images nahi dikhengi app mein
          sed -i '/assets:/d' pubspec.yaml
          sed -i '/fonts:/d' pubspec.yaml
          sed -i '/- assets\//d' pubspec.yaml
          sed -i '/- images\//d' pubspec.yaml
          sed -i '/\.png/d' pubspec.yaml
          sed -i '/\.jpg/d' pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get || true

      - name: Build APK (Strategy 1: Release)
        id: build_release
        continue-on-error: true
        run: |
          flutter build apk --release --no-tree-shake-icons
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          fi

      - name: Build APK (Strategy 2: Debug Fallback)
        if: steps.build_release.outputs.success != 'true'
        id: build_debug
        continue-on-error: true
        run: |
          flutter build apk --debug
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          fi

            - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Edition-X-Built-APK
          # Yahan '*' use karne se jo bhi APK bani hogi wo utha li jayegi
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          
          
